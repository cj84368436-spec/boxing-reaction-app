<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>복싱 10타 챌린지</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 12px; background: #03080d; color: #f7fafc; }
    .shell { width: min(390px,100%); }
    .watermark { margin-bottom: 6px; color: #607a8f; font-size: 9px; text-align: center; }
    .device { height: min(844px,calc(100dvh - 44px)); min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); overflow: clip; border: 1px solid #2a4052; border-radius: 28px; background: #07111b; }
    .device > :not(.stage) { flex-shrink: 0; }
    .hud { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
    .kicker { margin-top: 4px; color: #8aa0b4; font-size: 9px; font-weight: 800; letter-spacing: .8px; }
    .hud-right { display: flex; align-items:center; gap: 8px; }
    #sound-button { min-height:44px; min-width:72px; border:0; border-radius:10px; background:#172a3a; color:#dce8f1; font-size:12px; cursor:pointer; }
    #punch-count { font-size: 11px; font-weight: 950; }
    #status { min-height:28px; padding: 4px 9px; border: 1px solid #35536b; border-radius: 99px; background: #102333; color: #cfe8da; font-size: 12px; text-align:center; font-weight:700; }
    #status.defend { border-color: #e5484d; background: #3a1b24; }
    .progress { display: grid; grid-template-columns: repeat(10,1fr); gap: 4px; }
    .progress-bar { height: 4px; border-radius: 99px; background: #2a4052; }
    .progress-bar.current { background: #ff7a80; }
    .progress-bar.resolved { background: #56d68b; }
    .stage { position: relative; display: grid; place-items: center; flex:1; min-height: 0; overflow: clip; border: 1px solid #2a4052; border-radius: 24px; background: #132433; }
    .stage.evaded { border-color:#56d68b; box-shadow:inset 0 0 24px #56d68b22; }
    .stage.hit { border-color: #ff666d; box-shadow: inset 0 0 70px rgba(255,80,86,.22); }
    .rope { position: absolute; left: -16px; right: -16px; height: 4px; border-radius: 99px; background: #8e343a; opacity: .72; }
    .rope.r1 { top: 23%; } .rope.r2 { top: 48%; } .rope.r3 { top: 73%; }
    .boxer-camera { position:absolute; inset:0; display: grid; place-items: center; pointer-events:none; }
    #boxer-svg { width: 100%; height: 100%; position:absolute; inset:0; }
    .result-card { position: absolute; z-index: 10; inset: 0; display: none; padding: 14px; background:#07111b; }
    .result-card.visible { display: flex; flex-direction:column; gap:8px; }
    .result-content { overflow:auto; min-height:0; flex:1; padding-bottom:10px; }
    .result-title { text-align: center; font-size: 17px; font-weight: 950; letter-spacing: 1px; }
    .summary { display: flex; justify-content: space-around; font-size: 10px; font-weight: 950; }
    .perfect { color: #56d68b; } .safe { color: #f3c969; } .hit { color: #ff7a80; }
    #result-list { border-top: 1px solid #243b4d; }
    .result-row { min-height:52px; padding:8px 0; display: grid; align-content: center; border-bottom: 1px solid #243b4d; }
    .result-attack { font-size: 10px; font-weight: 900; } .result-detail { margin-top: 2px; color: #8aa0b4; font-size: 8px; font-weight: 700; }
    .result-card button { flex-shrink:0; min-height:44px; border: 0; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }
    #retry-button { background: #e5484d; min-height:48px; } #replay-seed-button,#mode-button { background: #243b4d; }
    .debug { min-height: 24px; display: flex; align-items: center; gap: 5px; color: #607a8f; font-size: 9px; }
    .debug[hidden] { display: none; }
    .debug input { width: 92px; padding: 4px 6px; border: 1px solid #35536b; border-radius: 6px; background: #102333; color: #dce8f1; }
    .debug button { padding: 5px 8px; border: 0; border-radius: 6px; background: #243b4d; color: #dce8f1; font-size: 9px; font-weight: 800; }
    #instance { margin-left: auto; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .defense-btn { min-height: 58px; border: 2px solid #52677a; border-radius: 16px; background: #172a3a; color: #f7fafc; font-size: 16px; font-weight: 950; touch-action: manipulation; }
    .defense-btn.pressed { border-color: #ff7a80; background: #b92e36; transform: scale(.97); }
    .defense-btn:disabled { opacity: .52; }

    [hidden] { display: none !important; }
    .stage { background: radial-gradient(ellipse at 50% 0%,#334454 0%,#152536 55%,#0b1520 100%); }
    .rope { opacity: .3; }
    .intro-card { position: absolute; z-index: 12; inset: 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: rgba(7,17,27,.96); overflow: auto; }
    .intro-card > * { flex-shrink:0; }
    .intro-card > :first-child { margin-top:auto; }
    .intro-card > :last-child { margin-bottom:auto; }
    #intro-card { padding:0; gap:0; }
    .intro-copy { min-height:0; flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .intro-actions { padding:14px; border-top:1px solid #243b4d; display:flex; flex-direction:column; gap:8px; }
    #intro-card > * { margin:0; }
    #intro-card > .intro-copy { flex-shrink:1; }
    .eyebrow { color: #f3c969; font-size: 10px; font-weight: 800; letter-spacing: 2px; }
    h2 { margin: 0; font-size: 27px; line-height: 1.3; letter-spacing: -1px; }
    .intro-card p { margin: 0; color: #c3cfda; font-size: 14px; line-height:22px; word-break: keep-all; }
    .intro-card .instruction { padding: 12px; border-radius: 10px; background: #1b3041; }
    .intro-card small { color: #9db0c1; font-size:12px; line-height:18px; }
    .primary,.secondary { flex-shrink: 0; min-height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
    .primary { background: #f3c969; color: #18202b; }
    .secondary { background: #233a4d; color: white; }
    #round-hint { position: absolute; top: 16px; left: 10px; right: 10px; min-height: 24px; text-align: center; color: #f3c969; font-size: 13px; font-weight: 800; pointer-events: none; text-shadow: 0 2px 5px #000; }
    #pause-button { position: absolute; right: 8px; bottom: 8px; border: 1px solid #52677a; border-radius: 8px; background: #142536; color: white; min-width:64px; min-height:44px; cursor: pointer; }
    #mode-label { position:absolute; left:12px; bottom:16px; padding:5px 8px; border-radius:8px; background:#07111bc7; color:#b6c5d1; font-size:11px; pointer-events:none; }
    .progress-bar.resolved.safe { background: #f3c969; }
    .progress-bar.resolved.hit { background: #ff7a80; }
    .defense-btn { cursor: pointer; font-size: 14px; min-height: 52px; }
    .defense-btn small { font-size: 10px; opacity: .5; margin-left: 4px; }
    .defense-btn.suggested { border-color: #f3c969; box-shadow: inset 0 0 12px #f3c96922; }
    #coach-result { margin:8px 0; text-align: center; font-size:13px; line-height:19px; color:#c3cfda; }
    .summary { font-size:12px; padding:8px 0; gap:6px; flex-wrap:wrap; }
    .result-detail { font-size:12px; line-height:18px; color:#afbfcd; font-weight:500; }
    .result-attack { font-size:12px; }
    button:focus-visible { outline:3px solid #f3c969; outline-offset:2px; }
    @media(max-height:700px) { body { padding:4px; } .watermark { display:none; } .device { height:calc(100dvh - 8px); gap:6px; } .intro-card { padding:14px; gap:10px; } h2 { font-size:22px; } .defense-btn { min-height:52px; } }
    .coach-card { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #43504d; text-align:left; }
    .coach-card > svg { width:104px; height:128px; flex-shrink:0; background:#233c3c; border-radius:14px; }
    .coach-copy { min-width:0; display:grid; gap:7px; }
    .coach-label { color:#cab78c; font-size:10px; font-weight:700; }
    .coach-line { color:#f4e5c7; font-size:18px; line-height:25px; font-weight:800; word-break:keep-all; }
    .coach-note { color:#aebfbd; font-size:12px; line-height:18px; word-break:keep-all; }
    #coach-ringside { padding:0 10px 0 0; border:0; border-radius:12px; background:#162c2d; min-height:72px; }
    #coach-ringside > svg { width:64px; height:72px; border-radius:12px; }
    #coach-ringside .coach-line { font-size:13px; line-height:18px; }
    #coach-ringside .coach-note { display:none; }
    .rematch-focus { padding:12px; margin-top:10px; border-radius:12px; background:#203435; }
    #rematch-title { color:#f3c969; font-size:14px; }
    #rematch-body { color:#d1deda; font-size:12px; line-height:18px; margin:5px 0 0; }
    #retry-button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    #retry-note { font-size:10px; line-height:15px; color:#ffe2db; font-weight:400; }
    @media(max-height:700px) {
      #coach-result { margin:4px 0; padding:0; gap:8px; }
      #coach-result > svg { width:64px; height:72px; }
      #coach-result .coach-line { font-size:13px; line-height:18px; }
      #coach-result .coach-note { display:none; }
    }
    .intro-copy > * { flex-shrink:0; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="watermark">브라우저 플레이 · 앱인토스 기기 테스트 전</div>
    <section class="device" aria-label="P0 Browser Preview">
      <header class="hud"><div><h1>복싱 10타 챌린지</h1><div class="kicker">주먹을 읽고, 한 번씩 피하세요</div></div><div class="hud-right"><span id="punch-count">0 / 10</span><button id="sound-button" type="button" aria-label="소리 끄기">소리 켜짐</button></div></header>
      <div id="status">공격마다 버튼 한 번</div>
      <div class="progress">
        <div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div>
        <div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div><div class="progress-bar"></div>
      </div>
      <div class="stage" id="stage">
        <div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div>
        <div class="boxer-camera" id="boxer-camera"><svg id="boxer-svg" viewBox="0 0 280 400"></svg></div>

        <div id="round-hint"></div><span id="mode-label" hidden></span>
        <button id="pause-button" type="button" aria-label="일시 정지" hidden>Ⅱ 정지</button>
        <div class="intro-card" id="intro-card">
          <div class="intro-copy">
          <div id="coach-intro"></div>
          <h2>주먹을 보고, 피하세요.</h2>
          <p>화면 아래 버튼을 눌러 피하세요.<br>짧은 잽은 좌우, 어깨를 젖히는 뒷손은 왼쪽.<br>팔을 벌려 옆으로 오는 훅은 오른쪽으로 숙이세요.</p>
          <p>가드는 두 번, 회피하면 한 칸 회복.<br>스트레이트는 뒤로 빠져도 닿아요.</p>
          </div><div class="intro-actions">
          <button id="begin-button" class="primary" type="button">여유 있게 시작</button>
          <button id="fast-button" class="secondary" type="button">원래 속도로 도전</button>
          <small>회피는 한 동작씩. 너무 빠르면 복귀 뒤 다시 누르세요.</small>
        </div></div>
        <div class="intro-card" id="pause-card" hidden><h2>잠시 쉬어갑니다</h2><p>멈춘 순간부터 이어집니다.<br>준비되면 계속하기를 눌러주세요.</p><button id="resume-button" class="primary" type="button">계속하기</button></div>
        <div class="result-card" id="result-card">
          <div class="result-content"><div class="result-title" id="result-title" role="heading" aria-level="2" aria-live="polite">라운드 종료</div><div id="coach-result"></div><div class="rematch-focus"><strong id="rematch-title"></strong><p id="rematch-body"></p></div>
          <div class="summary"><span id="summary-perfect" class="perfect"></span><span id="summary-safe" class="safe"></span><span id="summary-hit" class="hit"></span></div>
          <div id="result-list"></div></div>
          <button aria-label="다시 도전" id="retry-button" type="button"><span id="retry-label">관장에게 다시 도전</span><small id="retry-note">같은 공격 순서 · 같은 속도</small></button>
          <button id="replay-seed-button" type="button" hidden>같은 공격으로 다시</button>
          <button id="new-pattern-button" type="button" style="background:#243b4d">다른 패턴 도전</button><button id="mode-button" type="button">속도 다시 선택</button>
        </div>
      </div>
      <div class="debug"><label for="seed-input">SEED</label><input id="seed-input" type="number" inputmode="numeric"><button id="start-seed-button" type="button">START SEED</button><span id="instance"></span></div>
      <div id="coach-ringside" hidden></div>
      <div class="controls" hidden>
        <button type="button" class="defense-btn" data-btn="LEFT">← 왼쪽 <small>A</small></button><button type="button" class="defense-btn" data-btn="RIGHT">오른쪽 → <small>D</small></button>
        <button type="button" class="defense-btn" data-btn="BACK">뒤로 피하기 <small>S</small></button><button type="button" class="defense-btn" data-btn="GUARD">가드 <small>W</small></button>
      </div>
    </section>
  </main>
  <script type="module" src="./preview-client.mjs"></script>
</body>
</html>
